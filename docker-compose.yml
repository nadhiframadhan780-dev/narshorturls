version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: narshort-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:password123@postgres:5432/narshort?schema=public
      - REDIS_URL=redis://redis:6379
      - APP_URL=https://narshort.url
      - JWT_SECRET=narshort_super_secure_jwt_secret_key_2026
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - narshort-net

  postgres:
    image: postgres:16-alpine
    container_name: narshort-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: narshort
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d narshort"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - narshort-net

  redis:
    image: redis:7-alpine
    container_name: narshort-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - narshort-net

volumes:
  postgres_data:
  redis_data:

networks:
  narshort-net:
    driver: bridge
